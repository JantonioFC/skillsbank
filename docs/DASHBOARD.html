        body {

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .search-container {
            position: sticky;
            top: 10px;
            z-index: 100;
            margin-bottom: 30px;
        }
        #search {
            width: 100%;
            padding: 15px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            border: 2px solid var(--card-bg);
            background: #1e293bd9;
            color: #fff;
            backdrop-filter: blur(10px);
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
        }
        #search:focus {
            border-color: var(--primary);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: var(--primary);
        }
        .card h3 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--primary);
        }
        .card p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-muted);
            flex-grow: 1;
        }
        .card .meta {
            margin-top: 15px;
            font-size: 0.75rem;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            background: #334155;
            padding: 3px 8px;
            border-radius: 4px;
            color: var(--accent);
        }
        .source-badge {
            color: #fbbf24;
        }

        const grid = document.getElementById('grid');
        const search = document.getElementById('search');
        const stats = document.getElementById('stats');

        function render(items) {
            grid.innerHTML = items.map(s => `
                <div class="card">
                    <h3>${s.name}</h3>
                    <p>${s.description}</p>
                    <div class="meta">
                        <span class="badge source-badge">@${s.source}</span>
                        ${s.categories.map(c => `<span class="badge">${c}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            stats.innerText = `Mostrando ${items.length} de ${skills.length} habilidades disponibles.`;
        }

        search.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = skills.filter(s => 
                s.name.toLowerCase().includes(term) || 
                s.description.toLowerCase().includes(term) ||
                s.source.toLowerCase().includes(term) ||
                s.categories.some(c => c.toLowerCase().includes(term))
            );
            render(filtered);
        });

        render(skills);
    </script>
