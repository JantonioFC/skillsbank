name: Backup Registry CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify skills directory exists
        run: |
          echo "✅ Backup repo health check"
          skill_count=$(find skills/ -name "SKILL.md" | wc -l)
          echo "Total skills in backup: $skill_count"
          test "$skill_count" -gt 0 || (echo "❌ No skills found!" && exit 1)

      - name: Summary
        run: |
          {
            echo "## Backup Registry Health"
            echo ""
            echo "- Skills: $(find skills/ -name 'SKILL.md' | wc -l)"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Status: ✅ Backup synced successfully"
          } >> "$GITHUB_STEP_SUMMARY"
